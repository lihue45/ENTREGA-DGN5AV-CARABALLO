<section class="contacto-pagina">
  <div class="justificacion contacto-contenido">
    <div class="contacto-info">
      <p>
        ¿Tenés alguna duda sobre la fiesta? Escribime y te respondo lo antes posible
        por mail, teléfono o Instagram.
      </p>

        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg><a href="https://instagram.com/lihue.u">@lihue.u</a></li>
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg><a href="tel:2477211490">2477-211490</a></li>
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg><a href="mailto:lihuec50@gmail.com">lihuec50@gmail.com</a></li>
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg><span>calle falsa 123, Pergamino, Buenos Aires</span></li>
      </ul>
    </div>
    <form class="formulario-contacto">
      <div class="campo-columna">
        <label for="contacto-nombre">Nombre</label>
        <input type="text" id="contacto-nombre" name="nombre" placeholder="ej.: Lihué Caraballo">
      </div>
      <div class="campo-columna">
        <label for="contacto-email">Email</label>
        <input type="email" id="contacto-email" name="email" placeholder="ej.: ejemplo@gmail.com">
      </div>
      <div class="campo-columna">
        <label for="contacto-telefono">Teléfono</label>
        <input type="tel" id="contacto-telefono" name="telefono" placeholder="ej.: 2477211490">
      </div>
      <div class="campo-columna">
        <label for="contacto-mensaje">Mensaje</label>
        <textarea id="contacto-mensaje" name="mensaje" rows="6" placeholder="ej.: Tu consulta"></textarea>
      </div>
      <button type="submit">Enviar</button>
    </form>
  </div>
</section>
